[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aitmeral-enhancer"
version = "1.0.0"
description = "AITMERAL — Video Enhancer, Upscaler & RAW Lossless Converter with modern TUI, CLI and local Web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AITMERAL Project" }]
keywords = [
  "video", "upscaler", "enhancer", "ffmpeg", "hdr", "sdr",
  "lossless", "raw", "yt-dlp", "tui", "textual", "web-ui",
]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
  "rich>=13.0",
  "textual>=1.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]

[project.scripts]
aitmeral = "aitmeral.cli:main"

[tool.setuptools.packages.find]
include = ["aitmeral*"]

[tool.setuptools.package-data]
aitmeral = ["web/static/*"]
