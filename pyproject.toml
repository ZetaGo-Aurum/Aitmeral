[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aitmeral-enhancer"
version = "2.0.1"
description = "AITMERAL v2 — AI Video/Image Enhancer, Upscaler & RAW Lossless Converter (mmagic + Real-ESRGAN + ffmpeg)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AITMERAL Project" }]
keywords = [
  "video", "upscaler", "enhancer", "ffmpeg", "hdr", "sdr",
  "lossless", "raw", "yt-dlp", "tui", "textual", "web-ui",
  "ai", "mmagic", "real-esrgan", "super-resolution", "image-enhancement"
]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "rich>=13.0",
  "textual>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "numpy>=1.24",
  "tqdm>=4.66",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]
# Primary AI engine (mmagic) - install via: pip install "aitmeral-enhancer[mmagic]"
mmagic = [
  "mmcv>=2.0.1",
  "mmengine>=0.10",
]
# Alternative AI engine (Real-ESRGAN) - install via: pip install "aitmeral-enhancer[realesrgan]"
realesrgan = [
  "basicsr",
  "facexlib",
  "gfpgan",
]
# All AI engines
ai = ["mmagic", "realesrgan"]
# Full install
full = ["youtube", "mmagic", "realesrgan"]

[project.scripts]
aitmeral = "aitmeral.cli:main"

[tool.setuptools.packages.find]
include = ["aitmeral*"]

[tool.setuptools.package-data]
aitmeral = ["web/static/*", "ai_models/*"]